<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | iBUY Philippines</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <nav class="navbar navbar-expand-lg navbar-dark container">
        <a class="navbar-brand" href="#"
          ><span class="brand-mark">iBUY</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
          aria-controls="nav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav me-lg-3">
            <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Rooms</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Offers</a></li>
          </ul>
          <form class="search-box flex-grow-1 my-2 my-lg-0" role="search">
            <input
              class="form-control"
              type="search"
              placeholder="What are you looking for?"
              aria-label="Search"
            />
          </form>
          <ul class="navbar-nav ms-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="register.html">Register</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="container">
      <div class="row auth-wrap align-items-center g-0">
        <div class="col-lg-6 d-flex justify-content-center py-4">
          <div class="auth-card">
            <h1 class="h3 fw-bold mb-1">Log in</h1>
            <p class="text-muted mb-4">
              Welcome back. Log in to see your cart and orders.
            </p>
            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  autocomplete="email"
                  required
                />
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group has-validation">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    autocomplete="current-password"
                    minlength="8"
                    required
                  />
                  <div class="invalid-feedback">
                    Password must be at least 8 characters.
                  </div>
                </div>
              </div>
              <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  /><label class="form-check-label" for="remember"
                    >Remember me</label
                  >
                </div>
                <a href="#" class="small">Forgot password?</a>
              </div>
              <button class="btn btn-ibuy w-100" type="submit">Log in</button>
            </form>
            <p class="text-center mt-4 mb-0">
              New to iBUY? <a href="register.html">Create an account</a>
            </p>
          </div>
        </div>
        <div class="col-lg-6 auth-side align-self-stretch p-4">
          <div class="ph h-100" style="min-height: 420px"></div>
        </div>
      </div>
    </main>
    <footer class="py-3 mt-5">
      <div class="container text-center text-muted">
        &copy; 2026 iBUY Philippines
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
